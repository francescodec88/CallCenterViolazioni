<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 p-4">
  <ng-container *ngFor="let card of cards">
    <mat-card class="glass-card" [@fadeSlide]>
      <mat-card-header>
        <mat-card-title>{{card.title}}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>{{card.content}}</p>
      </mat-card-content>
    </mat-card>
  </ng-container>
</div>
